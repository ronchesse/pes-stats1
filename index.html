<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES Statistics</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 15px;
            margin: 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #242424);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        input {
            width: 80px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2ea6ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>📊 Статистика PES</h2>
    
    <div id="stats-container" class="card">
        <p>Завантаження даних...</p>
    </div>

    <button onclick="saveStats()">💾 Зберегти зміни</button>

<script>
    const WEB_APP_URL = "СЮДІ_ВСТАВ_ПОСИЛАННЯ_З_КРОКУ_1"; // Встав скопійований Web App URL з Apps Script

    function loadStats() {
        fetch(WEB_APP_URL)
            .then(res => res.json())
            .then(data => {
                let html = "";
                for (let key in data) {
                    html += `
                        <div class="row">
                            <span><b>${key}</b></span>
                            <input type="text" id="stat_${key}" value="${data[key]}">
                        </div>
                    `;
                }
                document.getElementById("stats-container").innerHTML = html;
            });
    }

    function saveStats() {
        let inputs = document.querySelectorAll("input[id^='stat_']");
        let payload = {};

        inputs.forEach(input => {
            let key = input.id.replace("stat_", "");
            payload[key] = input.value;
        });

        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(() => {
            Telegram.WebApp.showAlert("Зміни успішно збережено!");
            loadStats();
        });
    }

    Telegram.WebApp.ready();
    loadStats();
</script>
</body>
</html>
