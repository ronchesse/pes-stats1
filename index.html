<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BALLON D'OR - Статистика PES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 8px;
            margin: 0;
            font-size: 13px;
        }
        h2 { text-align: center; color: #fff; margin-bottom: 10px; font-size: 16px; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
        }
        .card h3 {
            margin: 0 0 8px 0;
            text-align: center;
            font-size: 14px;
            padding: 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .natan-title { background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb; }
        .arsen-title { background: #da363333; color: #f85149; border: 1px solid #da3633; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 5px 3px;
            text-align: center;
            border-bottom: 1px solid #21262d;
            font-size: 12px;
        }
        th { color: #8b949e; font-size: 11px; }
        input[type="number"] {
            width: 32px;
            padding: 3px;
            border-radius: 4px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            text-align: center;
            font-size: 12px;
        }
        .player-name {
            text-align: left;
            padding-left: 4px;
            font-weight: 600;
            color: #e6edf3;
        }
        .add-form {
            display: flex;
            gap: 4px;
            margin-top: 10px;
        }
        .add-form input {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            font-size: 12px;
        }
        .add-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            flex: 1;
        }
        #loading { text-align: center; padding: 20px; font-size: 15px; color: #8b949e; }
    </style>
</head>
<body>

    <h2>⚽ BALLON D'OR — СТАТИСТИКА</h2>
    <div id="loading">Завантаження даних...</div>
    <div id="app"></div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwLupAPTTe8z8Tb1Kv0cBmeQMA2cY5jAse8y0I6idXEel0rFcbX8BLf30WbnO8NFydx/exec";

        function loadData() {
            fetch(WEB_APP_URL)
                .then(res => res.json())
                .then(rows => {
                    document.getElementById("loading").style.display = "none";
                    
                    // --- НАТАН (рядки з 5 по 25, індекси 4-24) ---
                    let natanRows = "";
                    for (let i = 4; i < rows.length; i++) {
                        let r = rows[i];
                        if (!r) continue;
                        
                        let name = r[1] !== undefined ? String(r[1]).trim() : "";
                        if (name !== "" && name !== "ГРАВЕЦЬ") {
                            let num = r[0] !== undefined ? r[0] : '';
                            let goals = r[2] !== undefined && r[2] !== "" ? r[2] : 0;
                            let passes = r[3] !== undefined && r[3] !== "" ? r[3] : 0;
                            let gp = r[4] !== undefined && r[4] !== "" ? r[4] : (Number(goals) + Number(passes));
                            let matches = r[5] !== undefined && r[5] !== "" ? r[5] : 6;

                            natanRows += `<tr>
                                <td>${num}</td>
                                <td class="player-name">${name}</td>
                                <td><input type="number" value="${goals}" onchange="updateCell(${i+1}, 3, this.value)"></td>
                                <td><input type="number" value="${passes}" onchange="updateCell(${i+1}, 4, this.value)"></td>
                                <td><b>${gp}</b></td>
                                <td><input type="number" value="${matches}" onchange="updateCell(${i+1}, 6, this.value)"></td>
                            </tr>`;
                        }
                    }

                    // --- АРСЕН (рядки з 5 по 27, індекси 4-26) ---
                    let arsenRows = "";
                    for (let i = 4; i < rows.length; i++) {
                        let r = rows[i];
                        if (!r) continue;

                        let name = r[8] !== undefined ? String(r[8]).trim() : "";
                        if (name !== "" && name !== "ГРАВЕЦЬ") {
                            let num = r[7] !== undefined ? r[7] : '';
                            let goals = r[9] !== undefined && r[9] !== "" ? r[9] : 0;
                            let passes = r[10] !== undefined && r[10] !== "" ? r[10] : 0;
                            let gp = r[11] !== undefined && r[11] !== "" ? r[11] : (Number(goals) + Number(passes));
                            let matches = r[12] !== undefined && r[12] !== "" ? r[12] : 6;

                            arsenRows += `<tr>
                                <td>${num}</td>
                                <td class="player-name">${name}</td>
                                <td><input type="number" value="${goals}" onchange="updateCell(${i+1}, 10, this.value)"></td>
                                <td><input type="number" value="${passes}" onchange="updateCell(${i+1}, 11, this.value)"></td>
                                <td><b>${gp}</b></td>
                                <td><input type="number" value="${matches}" onchange="updateCell(${i+1}, 13, this.value)"></td>
                            </tr>`;
                        }
                    }

                    let html = `
                    <div class="card">
                        <h3 class="natan-title">КОМАНДА НАТАН</h3>
                        <table>
                            <tr><th>№</th><th style="text-align:left;">Гравець</th><th>ГОЛ</th><th>ПАС</th><th>Г+П</th><th>МАТЧІ</th></tr>
                            ${natanRows}
                        </table>
                        <div class="add-form">
                            <input type="number" id="num_natan" placeholder="№" style="width: 35px;">
                            <input type="text" id="name_natan" placeholder="Ім'я гравця" style="flex: 2;">
                            <button class="add-btn" onclick="addPlayer('natan')">+ Додати</button>
                        </div>
                    </div>

                    <div class="card">
                        <h3 class="arsen-title">КОМАНДА АРСЕН</h3>
                        <table>
                            <tr><th>№</th><th style="text-align:left;">Гравець</th><th>ГОЛ</th><th>ПАС</th><th>Г+П</th><th>МАТЧІ</th></tr>
                            ${arsenRows}
                        </table>
                        <div class="add-form">
                            <input type="number" id="num_arsen" placeholder="№" style="width: 35px;">
                            <input type="text" id="name_arsen" placeholder="Ім'я гравця" style="flex: 2;">
                            <button class="add-btn" onclick="addPlayer('arsen')">+ Додати</button>
                        </div>
                    </div>`;

                    document.getElementById("app").innerHTML = html;
                })
                .catch(err => {
                    document.getElementById("loading").innerText = "Помилка завантаження даних.";
                });
        }

        function updateCell(row, col, value) {
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ row: row, col: col, value: value })
            })
            .then(res => res.json())
            .then(() => {
                if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
                    Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
            });
        }

        function addPlayer(team) {
            let nameInput = document.getElementById(`name_${team}`);
            let numInput = document.getElementById(`num_${team}`);
            let name = nameInput.value.trim();
            let number = numInput.value.trim();

            if (!name) {
                alert("Введіть ім'я гравця!");
                return;
            }

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "addPlayer", team: team, name: name, number: number })
            })
            .then(res => res.json())
            .then(() => {
                if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
                    Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
                nameInput.value = "";
                numInput.value = "";
                setTimeout(loadData, 800);
            });
        }

        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }
        loadData();
    </script>
</body>
</html>
